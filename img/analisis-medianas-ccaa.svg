<text x="765" y="195" font-size="12.5" font-weight="700" fill="#1a1a2e">0,6643%</text>
<text x="819" y="195" font-size="11.5" fill="#6b6b7b">14 municipios</text>
<text x="200" y="229" font-size="13" fill="#1a1a2e" text-anchor="end">Castilla y León</text>
