<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="t-val d-val" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-val">Año de los valores catastrales vigentes en los municipios de La Rioja</title>
<desc id="d-val">Gráfico de barras horizontales ordenado de la valoración más antigua a la más reciente. Va de 1996 a 2010. Cuanto más antigua es la valoración, más desfasada está la base sobre la que se aplica el tipo del IBI.</desc>
<rect width="900" height="384" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">Antigüedad de los valores catastrales · La Rioja</text>
<text x="24" y="62" font-size="13" fill="#6b6b7b">Año de la última valoración vigente. El tipo de IBI se aplica sobre esa base, no sobre el precio de mercado.</text>
<text x="24" y="82" font-size="12" fill="#6b6b7b">Naranja: valoraciones anteriores a 2010. Verde: de 2010 en adelante.</text>
<line x1="176" y1="90" x2="810" y2="90" stroke="#d8d0c0"/>
<text x="166" y="117" font-size="13" fill="#1a1a2e" text-anchor="end">Santo Domingo de la Calzada</text>
<rect x="176" y="104" width="77" height="18" rx="2" fill="#c8522a"/>
<text x="261" y="117" font-size="12.5" font-weight="700" fill="#1a1a2e">1996</text>
<text x="303" y="117" font-size="11.5" fill="#6b6b7b">30 años</text>
<text x="166" y="145" font-size="13" fill="#1a1a2e" text-anchor="end">Logroño</text>
<rect x="176" y="132" width="115" height="18" rx="2" fill="#c8522a"/>
<text x="299" y="145" font-size="12.5" font-weight="700" fill="#1a1a2e">1997</text>
<text x="341" y="145" font-size="11.5" fill="#6b6b7b">29 años</text>
<text x="166" y="173" font-size="13" fill="#1a1a2e" text-anchor="end">Lardero</text>
<rect x="176" y="160" width="154" height="18" rx="2" fill="#c8522a"/>
<text x="338" y="173" font-size="12.5" font-weight="700" fill="#1a1a2e">1998</text>
<text x="380" y="173" font-size="11.5" fill="#6b6b7b">28 años</text>
<text x="166" y="201" font-size="13" fill="#1a1a2e" text-anchor="end">Haro</text>
<rect x="176" y="188" width="231" height="18" rx="2" fill="#c8522a"/>
<text x="415" y="201" font-size="12.5" font-weight="700" fill="#1a1a2e">2000</text>
<text x="457" y="201" font-size="11.5" fill="#6b6b7b">26 años</text>
<text x="166" y="229" font-size="13" fill="#1a1a2e" text-anchor="end">Nájera</text>
<rect x="176" y="216" width="269" height="18" rx="2" fill="#c8522a"/>
<text x="453" y="229" font-size="12.5" font-weight="700" fill="#1a1a2e">2001</text>
<text x="495" y="229" font-size="11.5" fill="#6b6b7b">25 años</text>
<text x="166" y="257" font-size="13" fill="#1a1a2e" text-anchor="end">Alfaro</text>
<rect x="176" y="244" width="308" height="18" rx="2" fill="#c8522a"/>
<text x="492" y="257" font-size="12.5" font-weight="700" fill="#1a1a2e">2002</text>
<text x="534" y="257" font-size="11.5" fill="#6b6b7b">24 años</text>
<text x="166" y="285" font-size="13" fill="#1a1a2e" text-anchor="end">Calahorra</text>
<rect x="176" y="272" width="462" height="18" rx="2" fill="#c8522a"/>
<text x="646" y="285" font-size="12.5" font-weight="700" fill="#1a1a2e">2006</text>
<text x="688" y="285" font-size="11.5" fill="#6b6b7b">20 años</text>
<text x="166" y="313" font-size="13" fill="#1a1a2e" text-anchor="end">Arnedo</text>
<rect x="176" y="300" width="615" height="18" rx="2" fill="#2a7c6f"/>
<text x="799" y="313" font-size="12.5" font-weight="700" fill="#1a1a2e">2010</text>
<text x="841" y="313" font-size="11.5" fill="#6b6b7b">16 años</text>
<text x="24" y="362" font-size="11.5" fill="#6b6b7b">Elaboración propia de TasasMunicipales.info con el año de los valores catastrales que publica el Ministerio de Hacienda en su consulta de información impositiva municipal.</text>
</svg>
