<text x="578" y="293" font-size="13" font-weight="700" fill="#1a1a2e" text-anchor="middle">9</text>
<text x="578" y="372" font-size="12" fill="#1a1a2e" text-anchor="middle">0,8%</text>
<text x="578" y="388" font-size="11" fill="#6b6b7b" text-anchor="middle">a 0,9%</text>
