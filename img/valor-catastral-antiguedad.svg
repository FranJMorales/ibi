<text x="380.0" y="120.0" font-family="Georgia, 'Source Serif 4', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">54</text>
<text x="380.0" y="324" font-family="Georgia, 'Source Serif 4', serif" font-size="13" text-anchor="middle" fill="#1a1a2e">2000–2009</text>
<rect x="460" y="192.96296296296296" width="120" height="107.03703703703704" rx="3" fill="#2a7c6f"/>
<text x="520.0" y="182.96296296296296" font-family="Georgia, 'Source Serif 4', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a2e">34</text>
<text x="520.0" y="324" font-family="Georgia, 'Source Serif 4', serif" font-size="13" text-anchor="middle" fill="#1a1a2e">2010–2019</text>
