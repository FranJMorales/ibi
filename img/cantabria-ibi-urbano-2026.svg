<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" role="img" aria-labelledby="t-tipos d-tipos" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-tipos">Tipo de gravamen del IBI urbano en los municipios de Cantabria para 2026</title>
