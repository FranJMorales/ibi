<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t-disp d-disp" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-disp">Relación entre el año de los valores catastrales y el tipo de IBI urbano de cada municipio</title>
<desc id="d-disp">Gráfico de dispersión con 134 municipios. El eje horizontal es el año de la última valoración catastral vigente (1986 a 2025) y el vertical el tipo de IBI urbano. Los puntos se reparten por todo el gráfico: no hay una relación clara entre tener valores antiguos y aplicar un tipo más alto.</desc>
<rect width="900" height="470" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">Valores catastrales antiguos y tipos altos no van de la mano</text>
<text x="24" y="61" font-size="13" fill="#6b6b7b">Cada punto es un municipio. Naranja: valoraciones anteriores a 2010.</text>
