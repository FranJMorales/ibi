<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" role="img" aria-labelledby="t-val d-val" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-val">Año de los valores catastrales vigentes en los municipios de Asturias</title>
<desc id="d-val">Gráfico de barras horizontales ordenado de la valoración más antigua a la más reciente. Va de 1994 a 2020. Cuanto más antigua es la valoración, más desfasada está la base sobre la que se aplica el tipo del IBI.</desc>
<rect width="900" height="524" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">Antigüedad de los valores catastrales · Asturias</text>
<text x="24" y="62" font-size="13" fill="#6b6b7b">Año de la última valoración vigente. El tipo de IBI se aplica sobre esa base, no sobre el precio de mercado.</text>
<text x="24" y="82" font-size="12" fill="#6b6b7b">Naranja: valoraciones anteriores a 2010. Verde: de 2010 en adelante.</text>
