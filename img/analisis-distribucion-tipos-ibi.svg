<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t-dist d-dist" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-dist">Distribución del tipo de IBI urbano en 134 municipios, ejercicio 2025</title>
<desc id="d-dist">Histograma. El eje horizontal recorre la horquilla legal del IBI urbano, del 0,40% al 1,10%, en tramos de una décima. El tramo más poblado reúne 44 de los 134 municipios analizados.</desc>
<rect width="900" height="430" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">Dónde se sitúan los 134 municipios dentro de la horquilla legal</text>
<text x="24" y="61" font-size="13" fill="#6b6b7b">Tipo de IBI urbano, ejercicio 2025. La ley permite del 0,40% al 1,10% (art. 72.1 TRLRHL).</text>
<line x1="70" y1="352" x2="866" y2="352" stroke="#1a1a2e"/>
<line x1="70" y1="228" x2="866" y2="228" stroke="#d8d0c0" stroke-dasharray="3 4"/>
<text x="62" y="232" font-size="11.5" fill="#6b6b7b" text-anchor="end">22</text>
<line x1="70" y1="104" x2="866" y2="104" stroke="#d8d0c0" stroke-dasharray="3 4"/>
<text x="62" y="108" font-size="11.5" fill="#6b6b7b" text-anchor="end">44</text>
<rect x="78" y="251" width="97" height="101" fill="#2a7c6f"/>
<text x="126" y="243" font-size="13" font-weight="700" fill="#1a1a2e" text-anchor="middle">18</text>
