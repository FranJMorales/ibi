<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t-plus d-plus" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-plus">Coeficiente máximo legal de la plusvalía municipal por años de tenencia frente a la mediana de los coeficientes aprobados por los municipios analizados</title>
<desc id="d-plus">Gráfico de dos líneas sobre los 21 tramos de tenencia del artículo 107.4 del TRLRHL. La línea superior es el coeficiente máximo que permite la ley, con su forma de doble joroba: sube hasta el séptimo año, cae en la franja de 12 a 16 años y se dispara a 0,40 a partir de los 20. La línea inferior es la mediana de lo que tienen aprobado los municipios de la muestra.</desc>
<rect width="900" height="440" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">La curva legal de la plusvalía y lo que aprueban los municipios</text>
<text x="24" y="61" font-size="13" fill="#6b6b7b">Coeficiente aplicable al valor catastral del suelo según los años transcurridos desde la compra (art. 107.4 TRLRHL).</text>
