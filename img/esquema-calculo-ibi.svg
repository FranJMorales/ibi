<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t-calc d-calc" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-calc">Esquema del cálculo de la cuota del IBI</title>
<desc id="d-calc">El valor catastral genera la base imponible; tras la reducción legal se obtiene la base liquidable; multiplicada por el tipo de gravamen municipal da la cuota íntegra; al restar las bonificaciones se obtiene la cuota líquida que se paga.</desc>
<rect width="900" height="300" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">Cómo se calcula la cuota del IBI</text>
<text x="24" y="61" font-size="13" fill="#6b6b7b">Del valor catastral al importe que aparece en tu recibo.</text>
<rect x="26" y="96" width="152" height="64" rx="4" fill="#fffdf8" stroke="#d8d0c0"/><text x="102.0" y="123" font-size="13.5" font-weight="700" fill="#1a1a2e" text-anchor="middle">Valor catastral</text><text x="102.0" y="143" font-size="12" fill="#6b6b7b" text-anchor="middle">Lo asigna el Catastro</text>
<path d="M186 128 L204 128" stroke="#c8522a" stroke-width="2"/><path d="M204 128 l-6 -4 v8 z" fill="#c8522a"/>
<rect x="212" y="96" width="152" height="64" rx="4" fill="#fffdf8" stroke="#d8d0c0"/><text x="288.0" y="123" font-size="13.5" font-weight="700" fill="#1a1a2e" text-anchor="middle">Base liquidable</text><text x="288.0" y="143" font-size="12" fill="#6b6b7b" text-anchor="middle">Valor menos reducción legal</text>
<path d="M372 128 L390 128" stroke="#c8522a" stroke-width="2"/><path d="M390 128 l-6 -4 v8 z" fill="#c8522a"/>
<rect x="398" y="96" width="152" height="64" rx="4" fill="#fffdf8" stroke="#d8d0c0"/><text x="474.0" y="123" font-size="13.5" font-weight="700" fill="#1a1a2e" text-anchor="middle">× Tipo de gravamen</text><text x="474.0" y="143" font-size="12" fill="#6b6b7b" text-anchor="middle">Lo fija tu ayuntamiento</text>
<path d="M558 128 L576 128" stroke="#c8522a" stroke-width="2"/><path d="M576 128 l-6 -4 v8 z" fill="#c8522a"/>
<rect x="584" y="96" width="152" height="64" rx="4" fill="#fffdf8" stroke="#d8d0c0"/><text x="660.0" y="123" font-size="13.5" font-weight="700" fill="#1a1a2e" text-anchor="middle">= Cuota íntegra</text><text x="660.0" y="143" font-size="12" fill="#6b6b7b" text-anchor="middle">Antes de beneficios</text>
<path d="M744 128 L762 128" stroke="#c8522a" stroke-width="2"/><path d="M762 128 l-6 -4 v8 z" fill="#c8522a"/>
<rect x="770" y="96" width="152" height="64" rx="4" fill="#fdf3ee" stroke="#d8d0c0"/><text x="846.0" y="123" font-size="13.5" font-weight="700" fill="#1a1a2e" text-anchor="middle">− Bonificaciones</text><text x="846.0" y="143" font-size="12" fill="#6b6b7b" text-anchor="middle">Solo si las solicitas</text>
<rect x="26" y="196" width="848" height="52" rx="4" fill="#c8522a" opacity="0.08"/><text x="46" y="219" font-size="14" font-weight="700" fill="#1a1a2e">Cuota líquida = base liquidable × tipo − bonificaciones</text><text x="46" y="238" font-size="12.5" fill="#6b6b7b">Ejemplo: 50.000 € × 0,64% = 320 € · con una bonificación del 50% por familia numerosa, 160 €.</text>
<text x="24" y="286" font-size="11.5" fill="#6b6b7b">Elaboración propia de TasasMunicipales.info según los artículos 65 a 74 del texto refundido de la Ley Reguladora de las Haciendas Locales.</text>
</svg>
