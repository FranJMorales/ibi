<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t-ivtm d-ivtm">
<title id="t-ivtm">Cómo se calcula el impuesto de circulación</title>
<desc id="d-ivtm">La clase y la potencia del vehículo determinan la cuota mínima que fija el artículo 95.1 del TRLRHL. El ayuntamiento puede multiplicarla por un coeficiente que no puede pasar de 2, y sobre el resultado se aplican las bonificaciones de su ordenanza.</desc>
<rect width="900" height="340" fill="#f5f0e8"/>
<defs><marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#c8522a"/></marker></defs>
<text x="30" y="46" font-family="Georgia, 'Source Serif 4', serif" font-size="21" font-weight="bold" fill="#1a1a2e">Del vehículo a la cuota: cómo se calcula el IVTM</text>
<rect x="30" y="90" width="180" height="118" rx="6" fill="#fffdf8" stroke="#d8d0c0" stroke-width="1.5"/>
<text x="120" y="130" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Clase y potencia</text>
<text x="120" y="154" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">del vehículo</text>
<text x="120" y="188" font-family="Georgia, 'Source Serif 4', serif" font-size="11.5" text-anchor="middle" fill="#6b6b7b">Ficha técnica</text>
<path d="M218 149 L270 149" stroke="#c8522a" stroke-width="2.5" marker-end="url(#f)"/>
<rect x="250" y="90" width="180" height="118" rx="6" fill="#fffdf8" stroke="#d8d0c0" stroke-width="1.5"/>
<text x="340" y="130" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Cuota mínima</text>
<text x="340" y="154" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">legal</text>
<text x="340" y="188" font-family="Georgia, 'Source Serif 4', serif" font-size="11.5" text-anchor="middle" fill="#6b6b7b">Art. 95.1 TRLRHL</text>
<path d="M438 149 L490 149" stroke="#c8522a" stroke-width="2.5" marker-end="url(#f)"/>
<rect x="470" y="90" width="180" height="118" rx="6" fill="#fffdf8" stroke="#d8d0c0" stroke-width="1.5"/>
<text x="560" y="130" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">× coeficiente</text>
<text x="560" y="154" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">municipal (máx. 2)</text>
<text x="560" y="188" font-family="Georgia, 'Source Serif 4', serif" font-size="11.5" text-anchor="middle" fill="#6b6b7b">Art. 95.4 TRLRHL</text>
<path d="M658 149 L710 149" stroke="#c8522a" stroke-width="2.5" marker-end="url(#f)"/>
<rect x="690" y="90" width="180" height="118" rx="6" fill="#fffdf8" stroke="#d8d0c0" stroke-width="1.5"/>
<text x="780" y="130" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Cuota a pagar</text>
<text x="780" y="154" font-family="Georgia, 'Source Serif 4', serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a2e">− bonificaciones</text>
<text x="780" y="188" font-family="Georgia, 'Source Serif 4', serif" font-size="11.5" text-anchor="middle" fill="#6b6b7b">Art. 95.6 TRLRHL</text>
<text x="30" y="256" font-family="Georgia, 'Source Serif 4', serif" font-size="13.5" fill="#1a1a2e">Ejemplo: turismo de 10 caballos fiscales → cuota mínima 34,08 € × coeficiente 2 = 68,16 € al año.</text>
<text x="30" y="284" font-family="Georgia, 'Source Serif 4', serif" font-size="12.5" fill="#6b6b7b">El coeficiente puede ser distinto para cada clase de vehículo y para cada tramo dentro de la clase.</text>
<text x="30" y="316" font-family="Georgia, 'Source Serif 4', serif" font-size="11.5" fill="#6b6b7b">Fuente: artículo 95 del texto refundido de la Ley Reguladora de las Haciendas Locales · TasasMunicipales.info</text>
</svg>
