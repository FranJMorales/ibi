<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" role="img" aria-labelledby="t-val d-val" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-val">Año de los valores catastrales vigentes en los municipios de Aragón</title>
<desc id="d-val">Gráfico de barras horizontales ordenado de la valoración más antigua a la más reciente. Va de 1990 a 2013. Cuanto más antigua es la valoración, más desfasada está la base sobre la que se aplica el tipo del IBI.</desc>
