<title id="t-tur">Coeficiente que aplican los municipios al IVTM de un turismo de 8 a 11,99 caballos fiscales</title>
<desc id="d-tur">De los 134 municipios analizados, 5 están en el tramo Coef. 1,0–1,2, 21 están en el tramo 1,2–1,4, 26 están en el tramo 1,4–1,6, 41 están en el tramo 1,6–1,8, 41 están en el tramo 1,8–2,0. El coeficiente máximo que permite la ley es 2.</desc>
