<text x="239" y="372" font-size="12" fill="#1a1a2e" text-anchor="middle">0,5%</text>
<text x="239" y="388" font-size="11" fill="#6b6b7b" text-anchor="middle">a 0,6%</text>
<rect x="304" y="189" width="97" height="163" fill="#2a7c6f"/>
<text x="352" y="181" font-size="13" font-weight="700" fill="#1a1a2e" text-anchor="middle">29</text>
<text x="352" y="372" font-size="12" fill="#1a1a2e" text-anchor="middle">0,6%</text>
<text x="352" y="388" font-size="11" fill="#6b6b7b" text-anchor="middle">a 0,7%</text>
<rect x="417" y="172" width="97" height="180" fill="#2a7c6f"/>
<text x="465" y="164" font-size="13" font-weight="700" fill="#1a1a2e" text-anchor="middle">32</text>
<text x="465" y="372" font-size="12" fill="#1a1a2e" text-anchor="middle">0,7%</text>
<text x="465" y="388" font-size="11" fill="#6b6b7b" text-anchor="middle">a 0,8%</text>
