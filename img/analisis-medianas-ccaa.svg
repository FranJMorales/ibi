<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" role="img" aria-labelledby="t-ccaa d-ccaa" font-family="Georgia, 'Source Serif 4', serif">
<title id="t-ccaa">Mediana del tipo de IBI urbano por comunidad autónoma en los municipios analizados</title>
<desc id="d-ccaa">Gráfico de barras horizontales. Cada barra es la mediana del tipo de IBI urbano de los municipios que la guía cubre en esa comunidad autónoma, con el número de municipios entre paréntesis. El IBI es un tributo municipal: la comunidad autónoma no fija el tipo.</desc>
<rect width="900" height="492" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">Mediana del tipo de IBI urbano por comunidad</text>
<text x="24" y="61" font-size="13" fill="#6b6b7b">El IBI lo fija cada ayuntamiento; las diferencias entre comunidades reflejan la muestra, no una regulación autonómica.</text>
<text x="200" y="127" font-size="13" fill="#1a1a2e" text-anchor="end">Extremadura</text>
<rect x="210" y="112" width="576" height="21" rx="2" fill="#c8522a"/>
<text x="794" y="127" font-size="12.5" font-weight="700" fill="#1a1a2e">0,7%</text>
<text x="848" y="127" font-size="11.5" fill="#6b6b7b">15 municipios</text>
<text x="200" y="161" font-size="13" fill="#1a1a2e" text-anchor="end">Asturias</text>
<rect x="210" y="146" width="560" height="21" rx="2" fill="#2a7c6f"/>
<text x="778" y="161" font-size="12.5" font-weight="700" fill="#1a1a2e">0,68%</text>
<text x="832" y="161" font-size="11.5" fill="#6b6b7b">13 municipios</text>
<text x="200" y="195" font-size="13" fill="#1a1a2e" text-anchor="end">Aragón</text>
