<line x1="210" y1="98" x2="810" y2="98" stroke="#d8d0c0"/>
<text x="24" y="476" font-size="11.5" fill="#6b6b7b">Elaboración propia de TasasMunicipales.info con los tipos del Ministerio de Hacienda. La muestra tiene sesgo hacia los municipios más poblados.</text>
