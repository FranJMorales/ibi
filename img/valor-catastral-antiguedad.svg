<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t-ant d-ant">
<title id="t-ant">Década de la última valoración catastral de los municipios de la guía</title>
<desc id="d-ant">Reparto de 134 municipios según la década en que entraron en vigor sus valores catastrales actuales: 1980: 4, 1990: 38, 2000: 54, 2010: 34, 2020: 4.</desc>
<rect width="900" height="400" fill="#f5f0e8"/>
<text x="30" y="44" font-family="Georgia, 'Source Serif 4', serif" font-size="20" font-weight="bold" fill="#1a1a2e">Cuándo se revisaron por última vez los valores catastrales</text>
<text x="30" y="68" font-family="Georgia, 'Source Serif 4', serif" font-size="13" fill="#6b6b7b">134 municipios · la ley prevé revisarlos a partir de los 10 años (art. 28 TRLCI)</text>
