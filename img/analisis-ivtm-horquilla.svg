<title id="t-ivtm">Tarifa del impuesto de circulación para un turismo de 8 a 11,99 caballos fiscales en los municipios analizados</title>
<desc id="d-ivtm">Gráfico de área. Los municipios se ordenan de la tarifa más baja a la más alta, de 34,08 a 68,16 euros al año. Se marcan la cuota mínima legal de 34,08 euros y el máximo que resulta de aplicar el coeficiente 2 que permite el artículo 95.4 del TRLRHL, 68,16 euros.</desc>
<rect width="900" height="420" fill="#f5f0e8"/>
<text x="24" y="38" font-size="21" font-weight="700" fill="#1a1a2e">El impuesto de circulación entre el suelo y el techo legal</text>
<text x="24" y="61" font-size="13" fill="#6b6b7b">Turismo de 8 a 11,99 CV. Cada punto es un municipio, ordenados de menor a mayor tarifa anual.</text>
