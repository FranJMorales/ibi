<title id="t-val">Año de los valores catastrales vigentes en los municipios de Extremadura</title>
<desc id="d-val">Gráfico de barras horizontales ordenado de la valoración más antigua a la más reciente. Va de 1994 a 2016. Cuanto más antigua es la valoración, más desfasada está la base sobre la que se aplica el tipo del IBI.</desc>
