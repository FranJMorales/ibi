<text x="804" y="388" font-size="11" fill="#6b6b7b" text-anchor="middle">a 1,1%</text>
<text x="24" y="414" font-size="11.5" fill="#6b6b7b">Elaboración propia de TasasMunicipales.info con los tipos que publica el Ministerio de Hacienda. Ningún municipio de la muestra baja del mínimo legal.</text>
